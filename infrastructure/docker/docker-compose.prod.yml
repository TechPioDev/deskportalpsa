# Desk Portal — the whole product on one Docker host, fronted by Caddy with automatic TLS.
#
#   cp infrastructure/docker/.env.prod.example infrastructure/docker/.env.prod   (fill it in)
#   docker compose -f infrastructure/docker/docker-compose.prod.yml --env-file infrastructure/docker/.env.prod up -d --build
#
# Public hostnames (DNS A records must point at this host):
#   ${PUBLIC_HOST}        -> web app (which proxies the API server-side)
#   auth.${PUBLIC_HOST}   -> Keycloak (sign-in)
#
name: desk-portal-prod

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: desk_portal
    volumes:
      - desk_pg:/var/lib/postgresql/data
      # Runs once, on an empty data directory: creates Keycloak's database beside desk_portal.
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d desk_portal"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    # start (not start-dev): production mode behind Caddy, which terminates TLS.
    command: ["start", "--import-realm", "--proxy-headers=xforwarded", "--http-enabled=true"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:?}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?}
      KC_HOSTNAME: https://auth.${PUBLIC_HOST:?}
      KC_HTTP_PORT: "8081"
      # Accounts live in Postgres. Without KC_DB Keycloak keeps them in a dev-file H2 store inside
      # its own container - with no volume, so every rebuild of the container lost every sign-in.
      # The database is created by postgres-init/keycloak.sql on the server's first start.
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: ${POSTGRES_USER:?}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:?}
    volumes:
      # The realm to import on an empty database. A running installation points this at its own
      # export (realm + users) so a move between stores carries the accounts and signing keys.
      - ${KEYCLOAK_IMPORT_DIR:-../keycloak}:/opt/keycloak/data/import:ro
    depends_on:
      postgres: { condition: service_healthy }
    restart: unless-stopped

  api:
    build: { context: ../.., dockerfile: apps/api/Dockerfile }
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Postgres: "Host=postgres;Database=desk_portal;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      RunMigrationsOnStartup: "true"
      # Tokens are issued for the PUBLIC issuer URL, so validation must use it too. Keycloak is
      # reached through Caddy on the public name — the containers resolve it via the proxy.
      Keycloak__Authority: "https://auth.${PUBLIC_HOST}/realms/desk"
      Secrets__EncryptionKey: ${SECRET_ENCRYPTION_KEY:?}
      Attachments__StoragePath: /data/attachments
      Attachments__SigningKey: ${ATTACHMENT_SIGNING_KEY:?}
      Attachments__PublicBaseUrl: "https://${PUBLIC_HOST}"
      Bootstrap__AdminEmail: ${BOOTSTRAP_ADMIN_EMAIL:?}
      Bootstrap__AdminName: ${BOOTSTRAP_ADMIN_NAME:?}
      Bootstrap__OrganizationName: ${BOOTSTRAP_ORG_NAME:?}
      Bootstrap__OrganizationSlug: ${BOOTSTRAP_ORG_SLUG:?}
      Connectors__BlockPrivateEgress: "true"
      # Outbound email (scheduled reports). Off while SMTP_HOST is empty. Set these in .env.prod on the
      # server only — the password never goes into the repository or the portal UI.
      Email__Smtp__Host: ${SMTP_HOST:-}
      Email__Smtp__Port: ${SMTP_PORT:-587}
      Email__Smtp__Security: ${SMTP_SECURITY:-StartTls}
      Email__Smtp__Username: ${SMTP_USERNAME:-}
      Email__Smtp__Password: ${SMTP_PASSWORD:-}
      Email__Smtp__From: ${SMTP_FROM:-}
      Email__Smtp__FromName: ${SMTP_FROM_NAME:-Desk Portal}
    volumes: ["desk_attachments:/data/attachments"]
    depends_on:
      postgres: { condition: service_healthy }
    restart: unless-stopped

  worker:
    build: { context: ../.., dockerfile: apps/worker/Dockerfile }
    environment:
      DOTNET_ENVIRONMENT: Production
      ConnectionStrings__Postgres: "Host=postgres;Database=desk_portal;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      Secrets__EncryptionKey: ${SECRET_ENCRYPTION_KEY:?}
      Attachments__StoragePath: /data/attachments
      Attachments__SigningKey: ${ATTACHMENT_SIGNING_KEY}
      Attachments__PublicBaseUrl: "https://${PUBLIC_HOST}"
      Sync__PollIntervalMinutes: ${SYNC_POLL_MINUTES:-5}
      # Outbound email (scheduled reports). Off while SMTP_HOST is empty. Set these in .env.prod on the
      # server only — the password never goes into the repository or the portal UI.
      Email__Smtp__Host: ${SMTP_HOST:-}
      Email__Smtp__Port: ${SMTP_PORT:-587}
      Email__Smtp__Security: ${SMTP_SECURITY:-StartTls}
      Email__Smtp__Username: ${SMTP_USERNAME:-}
      Email__Smtp__Password: ${SMTP_PASSWORD:-}
      Email__Smtp__From: ${SMTP_FROM:-}
      Email__Smtp__FromName: ${SMTP_FROM_NAME:-Desk Portal}
    volumes: ["desk_attachments:/data/attachments"]
    depends_on:
      postgres: { condition: service_healthy }
    restart: unless-stopped

  web:
    build: { context: ../.., dockerfile: apps/web/Dockerfile }
    environment:
      KEYCLOAK_ISSUER: "https://auth.${PUBLIC_HOST}/realms/desk"
      KEYCLOAK_CLIENT_ID: desk-web
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:-}
      APP_URL: "https://${PUBLIC_HOST}"
      DESK_API_BASE: "http://api:5080"
    depends_on: [api]
    restart: unless-stopped

  # Public exposure WITHOUT a VPS or open ports: a Cloudflare Tunnel running inside the compose
  # network, reaching web/keycloak by service name. Enable with: --profile tunnel
  # (requires TUNNEL_TOKEN from a remotely-managed tunnel; public-hostname routing lives in the
  # Cloudflare dashboard: PUBLIC_HOST -> http://web:3000, auth.PUBLIC_HOST -> http://keycloak:8081).
  # Caddy below is the alternative for a host with open 80/443 — use one or the other.
  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel"]
    command: ["tunnel", "--no-autoupdate", "run", "--token", "${TUNNEL_TOKEN:-}"]
    depends_on: [web, keycloak]
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    profiles: ["edge"]
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - desk_caddy_data:/data
      - desk_caddy_config:/config
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST}
    depends_on: [web, keycloak]
    restart: unless-stopped

volumes:
  desk_pg:
  desk_attachments:
  desk_caddy_data:
  desk_caddy_config:
