# Desk Portal vhosts for a host whose nginx already serves other sites.
# Copy to /etc/nginx/sites-available/piomanage, symlink into sites-enabled, reload.
# TLS: run `certbot --nginx -d piomanage.com -d auth.piomanage.com` once DNS resolves —
# it rewrites these blocks for 443 itself.
#
# Each block carries an HSTS header. It has no effect until certbot has moved the block to 443,
# because a browser must ignore HSTS received over plain HTTP — which is the whole point of it:
# the http->https redirect can be stripped on a first request over a hostile network, and this
# removes the first request to strip. Set per host rather than with includeSubDomains, so only
# names that actually serve TLS are promised anything, and deliberately without preload, which
# is a public list and effectively permanent.

server {
    listen 80;
    listen [::]:80;
    server_name piomanage.com;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Attachment uploads pass through here.
    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;

        # The OIDC callback answers with the session as httpOnly cookies carrying the access and
        # refresh JWTs, which are large before anything else is added. nginx buffers a response's
        # WHOLE header block and its 4k default is not enough for them, so /api/auth/callback
        # returned 502 "upstream sent too big header" while the app itself was healthy — a failure
        # that reads as the site being down rather than as a buffer being too small. Adding a CSP
        # header was what finally pushed it over, but the headroom was already gone.
        proxy_buffer_size 32k;
        proxy_buffers 8 32k;
        proxy_busy_buffers_size 64k;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name www.piomanage.com;
    add_header Strict-Transport-Security "max-age=31536000" always;
    return 301 https://piomanage.com$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name auth.piomanage.com;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        proxy_pass http://127.0.0.1:8181;
        proxy_http_version 1.1;
        # Keycloak runs with --proxy-headers=xforwarded and KC_HOSTNAME set to the
        # public URL; these headers are how it knows the request's real origin.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_buffer_size 16k;
        proxy_buffers 8 16k;
        # Keycloak sends its own HSTS header. Two on one response is ambiguous — a browser
        # honours the first and ignores the rest — so drop the upstream one and keep the policy
        # in one place.
        proxy_hide_header Strict-Transport-Security;
    }
}
