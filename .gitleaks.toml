# Baseline gitleaks config. The default ruleset already covers cloud keys, tokens, and
# private keys. Development-only fixtures are allow-listed so the scan stays high-signal.
title = "Desk Portal gitleaks"

[extend]
useDefault = true

[allowlist]
description = "Local dev fixtures and example files (never used in production)."
paths = [
  '''infrastructure/docker/\.env\.example''',
  '''apps/api/appsettings\.Development\.json''',
  '''apps/worker/appsettings\.json''',
]
regexes = [
  '''desk-root-token''',
  '''Password=desk''',
  # SecretCipherTests / EncryptedDbSecretStoreTests fixture key — decrypts nothing outside that
  # test run. An inline `gitleaks:allow` comment on the same line did not suppress this finding
  # (gitleaks 8.24.3, scanning via `git log -p`), so it is listed here instead, scoped to the
  # literal value rather than the whole file.
  '''w\+WEoJiLQLVmZzgEm//uVd0YpeTwnhwm2rUyftBqdO8=''',
  # The Web Push auth secret from RFC 8291 section 5's published worked example - public by
  # definition. WebPushCryptoTests, PushTests and RelationalQueryTests use it to prove the encryption
  # reproduces the RFC byte for byte. Scoped to the literal value, as above.
  '''BTBZMqHH6r4Tts7J_aSIgg''',
]
