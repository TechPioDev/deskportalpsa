name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  backend:
    name: Backend (build, test, vuln scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Restore
        run: dotnet restore Desk.sln
      # TreatWarningsAsErrors + NuGetAudit fail the build on any known package vulnerability.
      - name: Build (warnings-as-errors gate)
        run: dotnet build Desk.sln --no-restore -c Release
      - name: Unit tests
        run: dotnet test tests/unit/Desk.Tests.Unit.csproj --no-build -c Release --logger "trx;LogFileName=unit.trx"
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-test-results
          path: '**/*.trx'

  web:
    name: Web (lint, typecheck, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  e2e:
    name: Browser tests (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install web dependencies
        working-directory: apps/web
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund
      # Chromium only: the suite proves the app's own behaviour, not browser differences, and one
      # browser keeps the job under two minutes.
      - name: Install Chromium
        working-directory: apps/web
        run: npx playwright install chromium --with-deps
      # Warm the API build so Playwright's server start is not also a first compile.
      - name: Build API
        run: dotnet build apps/api/Desk.Api.csproj -c Debug
      # Enforced, not report-only: the suite is what proves a policy change before it ships.
      - name: Run browser tests
        working-directory: apps/web
        env:
          CSP_ENFORCE: "true"
        run: npm run test:e2e
      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The gitleaks BINARY, not gitleaks-action. The action began demanding a paid licence key
      # and now fails closed on every run, which took the secret gate offline entirely: the scan
      # stopped happening and the red cross said "missing licence", not "no secrets found". The
      # scanner itself is open source and unchanged, so run it directly and keep the gate.
      - name: gitleaks
        env:
          GITLEAKS_VERSION: 8.28.0
        run: |
          set -euo pipefail
          curl -sSfL -o /tmp/gitleaks.tar.gz             "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          # Scans the full history, since fetch-depth 0 is checked out above. Exit code 1 means a
          # finding and MUST fail the build; anything else is the scanner itself breaking, which
          # must also fail rather than pass silently.
          /tmp/gitleaks detect --source . --redact --no-banner --exit-code 1

  dependency-scan:
    name: Dependency vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: dotnet list package --vulnerable
        run: |
          dotnet restore Desk.sln
          dotnet list Desk.sln package --vulnerable --include-transitive 2>&1 | tee audit.txt
          if grep -q "has the following vulnerable packages" audit.txt; then
            echo "::error::Vulnerable packages detected"; exit 1
          fi
